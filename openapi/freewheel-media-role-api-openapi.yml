      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X GET "[host]/rest/role" -b cookies.txt -d '{"role_id":1}'
        samples-languages:
        - curl
      tags:
      - Role
    put:
      summary: role
      description: ''
      operationId: role-put
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - role_id
              properties:
                role_id:
                  type: integer
                  description: Unique ID of the Role
                  format: int32
                role_name:
                  type: string
                  description: Name of the Role (e.g. "Administrator"). <100 chars
                global:
