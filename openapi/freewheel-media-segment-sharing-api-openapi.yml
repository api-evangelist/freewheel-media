openapi: 3.2.0
info:
  title: buzz Segment Sharing API
  version: '0.5'
servers:
- url: https://buzz-key.api.beeswax.com/rest/
security:
- {}
tags:
- name: Segment Sharing
paths:
  /segment_sharing:
    post:
      summary: segment_sharing
      description: ''
      operationId: segment_sharing-post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - segment_key
              - shared_account_id
              properties:
                segment_key:
                  type: string
                  description: The `segment_key` (not `segment_id`!) from the Segment to be categorized. Must either belong to the Account of the user, or be shared with that user's Account.
                shared_account_id:
                  type: integer
                  description: The Account the segment should be shared with
                  format: int32
                active:
                  type: boolean
                  description: Is the sharing active?
                  default: false
                cpm_cost:
                  type: number
                  description: Cost to use the Segment
                  format: double
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"success\": true,\n    \"message\": \"segment_sharing created with ID = 1\",\n    \"payload\": {\n        \"id\": 1\n    }\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  message:
                    type: string
                    example: segment_sharing created with ID = 1
                  payload:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                        default: 0
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X POST "[host]/rest/segment_sharing" -b cookies.txt -d '{"segment_key":"stingersbx-1","shared_account_id":23, "active":1,"cpm_cost":1.23}'
        samples-languages:
        - curl
      tags:
      - Segment Sharing
    get:
      summary: segment_sharing
      description: ''
      operationId: segment_sharing-get
      parameters:
      - name: segment_sharing_id
        in: query
        description: Unique ID of the segment sharing
        schema:
          type: integer
          format: int32
      - name: segment_key
        in: query
        description: The `segment_key` (not `segment_id`!) from the Segment to be categorized. Must either belong to the Account of the user, or be shared with that user's Account.
        schema:
          type: string
      - name: shared_account_id
        in: query
        description: The Account the Segment should be shared with
        schema:
          type: integer
          format: int32
      - name: active
        in: query
        description: Is the sharing active?
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"success\": true,\n    \"payload\": [\n        {\n            \"segment_sharing_id\": 1,\n            \"shared_account_id\": 2,\n            \"segment_key\": \"stingertest-1\",\n            \"cpm_cost\": 1.23,\n            \"account_id\": 1,\n            \"create_date\": \"2016-03-30 13:58:39\",\n            \"update_date\": \"2016-03-30 13:58:39\",\n            \"alternative_id\": null,\n            \"notes\": null,\n            \"active\": true,\n            \"buzz_key\": \"stingersbx\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        segment_sharing_id:
                          type: integer
                          example: 1
                          default: 0
                        shared_account_id:
                          type: integer
                          example: 2
                          default: 0
                        segment_key:
                          type: string
                          example: stingertest-1
                        cpm_cost:
                          type: number
                          example: 1.23
                          default: 0
                        account_id:
                          type: integer
                          example: 1
                          default: 0
                        create_date:
                          type: string
                          example: '2016-03-30 13:58:39'
                        update_date:
                          type: string
                          example: '2016-03-30 13:58:39'
                        alternative_id: {}
                        notes: {}
                        active:
                          type: boolean
                          example: true
                          default: true
                        buzz_key:
                          type: string
                          example: stingersbx
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X GET "[host]/rest/segment_sharing" -b cookies.txt -d '{"segment_sharing_id":1}'
        samples-languages:
        - curl
      tags:
      - Segment Sharing
    put:
      summary: segment_sharing
      description: ''
      operationId: segment_sharing-put
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - segment_sharing_id
              properties:
                segment_sharing_id:
                  type: integer
                  description: Unique ID of the segment sharing
                  format: int32
                segment_key:
                  type: string
                  description: The `segment_key` (not `segment_id`!) from the Segment to be categorized. Must either belong to the Account of the user, or be shared with that user's Account.
                shared_account_id:
                  type: integer
                  description: The Account the segment should be shared with
                  format: int32
                active:
                  type: boolean
                  description: Is the sharing active?
                  default: false
                cpm_cost:
                  type: number
                  description: Cost to use the segment
                  format: double
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"success\": true,\n    \"payload\": [\n        {\n            \"id\": 1,\n            \"success\": true,\n            \"message\": \"segment_sharing updated with ID 1\"\n        }\n    ],\n    \"message\": \"segment_sharing update: 1 updated successfully\"\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                          default: 0
                        success:
                          type: boolean
                          example: true
                          default: true
                        message:
                          type: string
                          example: segment_sharing updated with ID 1
                  message:
                    type: string
                    example: 'segment_sharing update: 1 updated successfully'
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: 'curl -X PUT "[host]/rest/segment_sharing" -b cookies.txt -d ''{"segment_sharing_id":1, "active":1,"cpm_cost": 1.23}'''
        samples-languages:
        - curl
      tags:
      - Segment Sharing
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
x-readme-fauxas: true
