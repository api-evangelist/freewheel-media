        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"success\": true,\n    \"payload\": [\n        {\n            \"segment_category_id\": 3,\n            \"segment_category_key\": \"stingersbx-1\",\n            \"advertiser_id\": 1,\n            \"parent_category_key\": null,\n            \"segment_category_name\": \"My lists\",\n            \"account_id\": 1,\n            \"create_date\": \"2016-03-30 13:23:59\",\n            \"update_date\": \"2016-03-30 13:23:59\",\n            \"alternative_id\": null,\n            \"notes\": null,\n            \"active\": true,\n            \"buzz_key\": \"stingersbx\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        segment_category_id:
                          type: integer
                          example: 3
                          default: 0
                        segment_category_key:
                          type: string
                          example: stingersbx-1
                        advertiser_id:
                          type: integer
                          example: 1
                          default: 0
                        parent_category_key: {}
                        segment_category_name:
                          type: string
                          example: My lists
                        account_id:
                          type: integer
                          example: 1
                          default: 0
                        create_date:
                          type: string
                          example: '2016-03-30 13:23:59'
                        update_date:
                          type: string
                          example: '2016-03-30 13:23:59'
                        alternative_id: {}
                        notes: {}
                        active:
                          type: boolean
                          example: true
                          default: true
                        buzz_key:
                          type: string
                          example: stingersbx
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X GET "[host]/rest/segment_category" -b cookies.txt -d '{"segment_category_id":1}'
        samples-languages:
        - curl
      tags:
      - Segment Category
    put:
