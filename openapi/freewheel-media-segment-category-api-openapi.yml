        schema:
          type: integer
          format: int32
      - name: alternative_id
        in: query
        description: Any text up to 80 characters
        schema:
          type: string
      - name: segment_category_key
        in: query
        description: An auto-generated key in the format `<BUZZ_KEY>-<segment_category_id>`
        schema:
          type: string
      - name: segment_category_name
        in: query
        description: Name of the Segment Category. <191 chars
        schema:
          type: string
      - name: parent_category_key
        in: query
        description: Must be an active Segment Category. If omitted or set to NULL, this category will live at the top of the hierarchy.
        schema:
          type: string
      - name: advertiser_id
        in: query
