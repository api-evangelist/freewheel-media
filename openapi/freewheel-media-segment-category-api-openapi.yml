openapi: 3.2.0
info:
  title: buzz Segment Category API
  version: '0.5'
servers:
- url: https://buzz-key.api.beeswax.com/rest/
security:
- {}
tags:
- name: Segment Category
paths:
  /segment_category:
    post:
      summary: segment_category
      description: ''
      operationId: segment-4
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - segment_category_name
              properties:
                segment_category_name:
                  type: string
                  description: Name of the Segment Category. <191 chars
                parent_category_key:
                  type: string
                  description: Must be an active Segment Category. If omitted or set to NULL, this category will live at the top of the hierarchy.
                advertiser_id:
                  type: integer
                  description: Segment Categories may belong to the overall Account or to a single Advertiser.
                  format: int32
                alternative_id:
                  type: string
                  description: Any text up to 200 characters to identify the category
                notes:
                  type: string
                  description: Up to 255 characters
                active:
                  type: boolean
                  description: Is the category active
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"success\": true,\n    \"message\": \"segment_category created with ID = 1\",\n    \"payload\": {\n        \"id\": 1\n    }\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  message:
                    type: string
                    example: segment_category created with ID = 1
                  payload:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                        default: 0
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X POST "[host]/rest/segment_category" -b cookies.txt -d '{"advertiser_id":1, "parent_category_key":"stingersbx-1", "segment_category_name":"My lists"}'
        samples-languages:
        - curl
      tags:
      - Segment Category
    get:
