                advertiser_id:
                  type: integer
                  description: Must be active
                  format: int32
                native_offer_name:
                  type: string
                  description: Name of the Native Offer
                icon_asset_id:
                  type: integer
                  description: The ID of a CreativeAsset for the `icon` field to be shown in the Creative.
                  format: int32
                logo_asset_id:
                  type: integer
                  description: The ID of a CreativeAsset for the `logo` field to be shown in the Creative.
                  format: int32
                alternative_id:
                  type: string
                  description: An alternative id to lookup the  Line Item, if desired
                active:
                  type: boolean
                  description: Is the NativeOffer active
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"success\": true,\n    \"payload\": [\n        {\n            \"native_offer_id\": 1,\n            \"advertiser_id\": 13,\n            \"creative_template_id\": [\n                14,\n                15,\n                16,\n                17,\n                18,\n                19\n            ],\n            \"icon_asset_id\": 104,\n            \"logo_asset_id\": 105,\n            \"native_offer_name\": \"Native Test\",\n            \"title_short\": \"Beeswax Test\",\n            \"title_long\": null,\n            \"description_short\": \"Differentiate yourself from the pack with Beeswax\",\n            \"description_long\": null,\n            \"call_to_action\": \"Buy Now\",\n            \"sponsored\": \"Beeswax\",\n            \"store\": null,\n            \"likes\": null,\n            \"downloads\": null,\n            \"phone\": null,\n            \"address\": null,\n            \"display_url\": null,\n            \"star_rating\": 5,\n            \"price\": null,\n            \"sale_price\": null,\n            \"currency\": null,\n            \"account_id\": 1,\n            \"create_date\": \"2017-05-23 17:09:27\",\n            \"update_date\": \"2017-05-23 17:09:27\",\n            \"alternative_id\": null,\n            \"notes\": null,\n            \"active\": true,\n            \"buzz_key\": \"stinger\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        native_offer_id:
                          type: integer
                          example: 1
                          default: 0
                        advertiser_id:
                          type: integer
                          example: 13
                          default: 0
                        creative_template_id:
                          type: array
                          items:
                            type: integer
                            example: 14
                            default: 0
                        icon_asset_id:
                          type: integer
                          example: 104
                          default: 0
                        logo_asset_id:
                          type: integer
                          example: 105
                          default: 0
                        native_offer_name:
                          type: string
                          example: Native Test
                        title_short:
                          type: string
                          example: Beeswax Test
                        title_long: {}
                        description_short:
                          type: string
                          example: Differentiate yourself from the pack with Beeswax
                        description_long: {}
                        call_to_action:
                          type: string
                          example: Buy Now
                        sponsored:
                          type: string
                          example: Beeswax
                        store: {}
                        likes: {}
                        downloads: {}
                        phone: {}
                        address: {}
                        display_url: {}
                        star_rating:
                          type: integer
                          example: 5
                          default: 0
                        price: {}
                        sale_price: {}
                        currency: {}
                        account_id:
                          type: integer
                          example: 1
                          default: 0
                        create_date:
                          type: string
                          example: '2017-05-23 17:09:27'
                        update_date:
                          type: string
                          example: '2017-05-23 17:09:27'
                        alternative_id: {}
                        notes: {}
                        active:
                          type: boolean
                          example: true
                          default: true
                        buzz_key:
                          type: string
                          example: stinger
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X GET "[host]/rest/native_offer" -b cookies.txt -d '{"native_offer_id":1}'
        samples-languages:
