      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"success\": true,\n    \"payload\": [\n        {\n            \"id\": 1,\n            \"success\": true,\n            \"message\": \"creative updated with ID 1\"\n        }\n    ],\n    \"message\": \"creative update: 1 updated successfully\"\n}"
