      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X GET "[host]/rest/creative" -b cookies.txt -d '{"creative_id":1}'
        samples-languages:
        - curl
      tags:
      - Creative
    put:
      summary: creative
      description: ''
      operationId: creative-put
      requestBody:
        content:
          application/json:
            schema:
              type: object
