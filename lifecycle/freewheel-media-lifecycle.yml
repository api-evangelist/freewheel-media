versioning:
- family: FreeWheel Advertiser (Buzz) API
  scheme: resource-series
  current: '2.0'
  legacy: '0.5'
  detail: >-
    The harvested spec self-reports info.version 0.5. A 2.0 resource series runs
    alongside it, with 2.0 authentication usable against both 0.5 and 2.0
    resources. The 0.5 reporting resources were deprecated.
  docs: https://api-docs.freewheel.tv/advertiser/docs/upcoming-changes-to-the-buzz-api
- family: FreeWheel Demand / Partner APIs
  scheme: uri-path
  current: v1
  detail: >-
    Deal Sync and Creative Management are on /demand/v1. Audience Management
    serves /v1 lookup resources and /v2 audience resources from the same base.
- family: FreeWheel Publisher (MRM) APIs
  scheme: uri-path
  current: v4
  legacy: v3
  detail: >-
    V3 resources are XML; V4 resources are JSON with XML supported on select
    endpoints. Base path /services/v4/services.
  docs: https://api-docs.freewheel.tv/publisher/docs/getting-started
deprecation:
  policy_url: null
  sunset_header: false
  detail: >-
    FreeWheel announces deprecations as dated changelog entries and MRM Release
    Guides, but publishes no deprecation POLICY — no notice period, no support
    window, no RFC 8594 Sunset/Deprecation header support, and no `deprecated:
    true` flag on any of the 171 harvested operations. Because there is no
    published policy page, no Deprecation pointer is wired in apis.yml.
  announced_deprecations:
