  registry.npmjs.org search + package metadata, pypi.org, api.github.com/orgs/freewheel,
  and the FreeWheel developer documentation at api-docs.freewheel.tv
finding: >-
  FreeWheel publishes NO first-party client library for any of its APIs. Every
  package below is genuinely first-party — published from the github.com/freewheel
  organization or under the @freewheel npm scope — but all of it is front-end
  application tooling (a state-management framework, an ESLint plugin, a webpack
  plugin, a live-coding playground, a local task runner, a Python LP solver
  interface). None of it wraps the Buzz, Demand or Publisher APIs. FreeWheel's own
  Getting Started pages teach the API with raw cURL and say so explicitly: "You can
  access the REST API on the command line using cURL or through a client built in
  whichever language you prefer." Because no official API client exists, no SDKs
  pointer is wired into apis.yml.
