- aid: freewheel-media-demand-audience-management-api
  name: FreeWheel Demand Audience Management API
  description: >-
    Audience and segment management for FreeWheel demand partners. Lists data
    providers by ad-industry category, searches and filters third-party
    segments, and creates, retrieves and modifies audience definitions used to
    target FreeWheel supply. HTTP basic authentication, with an
    X-Freewheel-Ad-Industry header scoping requests to an ad industry.
  humanURL: https://api-docs.freewheel.tv/demand/reference/retrieve-audience-definitions
  baseURL: https://api.freewheel.tv/demand
  tags:
  - Advertising
  - Audiences
  - Segments
  - Data Providers
  properties:
  - type: OpenAPI
    url: openapi/freewheel-media-demand-audience-management-openapi-original.json
  - type: APIReference
    url: https://api-docs.freewheel.tv/demand/reference
  - type: Overlay
    url: overlays/freewheel-media-demand-audience-management-overlay.yaml
- aid: freewheel-media-demand-deal-sync-api
  name: FreeWheel Demand Deal Sync API
  description: >-
    Deal synchronization for FreeWheel demand partners. Retrieves programmatic
    deals available to a buyer seat (filterable by seller status, start/end date
    and last-updated timestamp), retrieves a single deal, and updates the buyer
    status on a deal so buy-side systems stay in sync with FreeWheel supply.
  humanURL: https://api-docs.freewheel.tv/demand/reference/retrieve-deals
  baseURL: https://api.freewheel.tv/demand/v1
  tags:
  - Advertising
  - Programmatic
  - Deals
  - Marketplace
  properties:
  - type: OpenAPI
    url: openapi/freewheel-media-demand-deal-sync-openapi-original.json
  - type: APIReference
    url: https://api-docs.freewheel.tv/demand/reference
  - type: Overlay
    url: overlays/freewheel-media-demand-deal-sync-overlay.yaml
- aid: freewheel-media-demand-creative-management-api
  name: FreeWheel Demand Creative Management API
  description: >-
    Creative management for FreeWheel demand partners. Creates, retrieves and
    updates creatives (ads) on an account, lists the underlying creatives of a
    composite ad, and assigns or removes creatives from programmatic deals so a
    buyer's creatives are approved against the deals they will serve on.
  humanURL: https://api-docs.freewheel.tv/demand/reference/retrieve-all-creatives
  baseURL: https://api.freewheel.tv/demand/v1
  tags:
