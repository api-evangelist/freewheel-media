apis:
- aid: freewheel-media-advertiser-buzz-api
  name: FreeWheel Advertiser (Buzz) API
  description: >-
    The REST API behind FreeWheel's Advertiser Suite / Beeswax DSP ("Buzz"). It
    exposes the full buy-side object model — accounts, advertisers, campaigns,
    line items, creatives and creative assets, targeting templates, bidding
    strategies and bid models, segments and custom lists, reporting queues,
    users and roles — over a JSON REST interface. Authentication is a session
    cookie obtained by POSTing credentials to /authenticate; the base host is
    per-customer (the Buzz key), which is why the published server is templated.
  humanURL: https://api-docs.freewheel.tv/advertiser
  baseURL: https://buzz-key.api.beeswax.com/rest/
  tags:
