    insertion orders and campaigns, placement operations, forecasting, analytics and reporting. V3 resources
    are XML, V4 resources are JSON with XML on select endpoints, and access is authenticated with OAuth
    2.0 access tokens. No machine-readable specification is published at a public URL and the reference
    documentation is disallowed in the docs host robots.txt, so no OpenAPI has been harvested for this
    entry.
