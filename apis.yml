name: FreeWheel Media
description: >-
  FreeWheel, a Comcast company, is an advertising technology platform for the
  streaming and premium video television marketplace. It gives advertisers,
  agencies, and media buyers direct connections to premium streaming TV
  inventory while helping publishers and programmers monetize their video
  content across linear and digital channels. Its product suites include the
  Advertiser Suite (media buying, planning, and campaign management via Strata),
  the Publisher Suite (ad decisioning, forecasting, and yield optimization for
  sellers), and a Marketplace connecting supply and demand. FreeWheel's platform
  emphasizes AI-driven optimization, real-time insights, identity, and
  cross-screen measurement for the converged TV ecosystem. Programmatic and
  operational access is delivered to partners through gated Publisher (MRM) and
  Marketer (SFX/Strata) platforms rather than a public self-service developer
  portal.
