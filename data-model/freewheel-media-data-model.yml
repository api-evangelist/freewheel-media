cross_domain_note: >-
  The Advertiser (Buzz) segment/creative model and the Demand creative/audience
  model are separate object graphs on separate hosts with separate credentials;
  nothing in the published contracts joins a Buzz creative_id to a Demand ad id,
  or a Buzz segment_key to a Demand segment. That seam is real and is the main
  thing an integrator has to bridge themselves.
