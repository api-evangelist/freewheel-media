format: http-status
rfc9457: false
note: >-
  FreeWheel does not use RFC 9457 problem+json anywhere. The Demand/Partner APIs
  return a bare HTTP status with a plain-text message; the Advertiser (Buzz) API
  wraps everything in its own success/payload/message/error envelope and can
  return HTTP 200 for a partially-failed bulk write, with per-object error_code
  values inside the payload. The harvested specs are thin on error responses —
  of 171 operations only five declare any non-2xx response at all (406 on the
  Buzz file-upload operations) — so the catalog below is taken mainly from the
  documented error reference rather than from the contract.
spec_coverage:
