  declared_codes:
  - status: 406
    count: 5
    source: openapi/freewheel-media-advertiser-buzz-openapi-original.json
    note: >-
      Declared on advertiser-put, account_alert-put, alert-post, alert-get and
      alert-put — and nowhere else. There is no pattern to it; the other 148
      operations declare only 200.
